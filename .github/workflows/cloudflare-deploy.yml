name: NYFB Cloudflare deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      HAS_CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build OpenNext application
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://brpqtdqejvlxsyzlyrfv.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_UElqtC2ySL6tG_DzRAKvYg_lbDTuqi9
        run: npx opennextjs-cloudflare build
      - name: Deploy to Cloudflare Workers
        if: env.HAS_CLOUDFLARE_TOKEN == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 89f555d8926b0bb1319735de4da6f7bd
        run: npx wrangler deploy
      - name: Explain deployment prerequisite
        if: env.HAS_CLOUDFLARE_TOKEN != 'true'
        run: echo "Build succeeded, but deployment was skipped. Add CLOUDFLARE_API_TOKEN as a GitHub Actions repository secret, then rerun this workflow."
